# Builds the Astro site and publishes it to GitHub Pages.
# One-time setup on GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  # Every push to main publishes the site…
  push:
    branches: [main]
  # …and it can also be started by hand from the Actions tab.
  workflow_dispatch:

# Read the repository, publish to Pages, and sign the deployment (OIDC).
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A newer push waits instead of cancelling a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Installs dependencies from package-lock.json, runs `npm run build`
      # (astro check + astro build) and uploads dist/ as the Pages artifact.
      - name: Install, build and upload the site
        uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
